# The checks that block a PR: any failure turns it red.
# The steps live in .github/actions/verify, shared with Publishing.
# The Playwright suite is split into 4 jobs that run side by side.
# PRs into main (releases and hotfixes) run them all, plus Lighthouse;
# PRs into any other branch, develop included, run the quick checks.
# Documentation-only PRs do not run this workflow.
name: Checks

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CONTEXT.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: ./.github/actions/verify
        with:
          shard: ${{ matrix.shard }}
          quick: ${{ github.base_ref != 'main' }}

      - name: Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 2

  lighthouse:
    name: Lighthouse
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: ./.github/actions/verify
        with:
          lighthouse: true

      # The Lighthouse HTML reports are a help: if the account's artifact quota
      # is full, the upload fails without turning the PR red. The targets are already in the job summary.
      - name: Lighthouse reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
          if-no-files-found: ignore
