# As verificações que bloqueiam um PR: qualquer falha deixa-o vermelho.
# Os PR só de documentação não correm este workflow.
# A Publicação (#58) chama-o antes de publicar, com `sem-desempenho: true`.
name: Verificações

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CONTEXT.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  workflow_call:
    inputs:
      sem-desempenho:
        description: 'Só as verificações que bloqueiam, sem os avisos de desempenho do Lighthouse'
        type: boolean
        default: false

permissions:
  contents: read

# Nos PR, um push novo cancela a verificação anterior.
# Chamado por outro workflow, fica num grupo só seu: a fila é de quem chama.
concurrency:
  group: verificacoes-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tipos e traduções
        run: npm run check

      - name: Formatação
        run: npm run format:check

      - name: Build publicado
        run: npm run build

      - name: Build do Lançamento comercial
        run: npm run build:lancamento

      - name: Navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Suite Playwright
        run: npm test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

      # O SEO, os pesos, as fontes e os pedidos bloqueiam.
      # O desempenho só avisa, no resumo do job, com a mediana de 3 execuções.
      - name: Lighthouse em modo telemóvel
        id: lighthouse
        run: npm run lighthouse -- ${{ inputs.sem-desempenho && '--sem-desempenho' || '' }}

      # Os relatórios HTML são uma ajuda: se a quota de artefactos da conta estiver cheia,
      # o upload falha sem deixar o PR vermelho. As metas já estão no resumo do job.
      - name: Relatórios do Lighthouse
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-lighthouse
          path: relatorio-lighthouse/
          retention-days: 7
