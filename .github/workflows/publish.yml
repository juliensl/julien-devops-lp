# After each merge into main: repeats the blocking checks, does the Publishing
# to Infomaniak and confirms that each published page answers with this commit.
# Documentation-only merges do not run this workflow.
# If anything fails, the job turns red and GitHub emails whoever merged.
#
# Rolling back: a revert PR, the normal way. In an emergency, "Re-run all jobs"
# on an older run publishes that commit again.
name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CONTEXT.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read

# One Publishing at a time, never cancelled halfway. If several arrive while
# one runs, GitHub keeps only the most recent, which publishes everything.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The same checks that block a PR, without the Lighthouse performance targets.
      - uses: ./.github/actions/verify
        with:
          performance: false

      # Until Julien creates the secrets (#57), Publishing is skipped with a warning.
      # The secrets keep their Portuguese names (PUBLICACAO_*) until Julien decides otherwise.
      - name: Publishing secrets
        id: secrets
        env:
          HAS_KEY: ${{ secrets.PUBLICACAO_CHAVE_SSH != '' }}
          HAS_SERVER: ${{ secrets.PUBLICACAO_SERVIDOR != '' }}
          HAS_USER: ${{ secrets.PUBLICACAO_UTILIZADOR != '' }}
        run: |
          missing=()
          [[ $HAS_KEY == true ]] || missing+=(PUBLICACAO_CHAVE_SSH)
          [[ $HAS_SERVER == true ]] || missing+=(PUBLICACAO_SERVIDOR)
          [[ $HAS_USER == true ]] || missing+=(PUBLICACAO_UTILIZADOR)
          if ((${#missing[@]} == 0)); then
            echo 'publish=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          warning="Publishing skipped. Missing secrets: ${missing[*]} (#57)."
          echo "::warning title=Publishing skipped::$warning"
          echo "### ⚠️ $warning" >>"$GITHUB_STEP_SUMMARY"

      - name: Install lftp
        if: steps.secrets.outputs.publish == 'true'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp

      - name: Publishing
        if: steps.secrets.outputs.publish == 'true'
        timeout-minutes: 10
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLICACAO_CHAVE_SSH }}
          PUBLISH_SERVER: ${{ secrets.PUBLICACAO_SERVIDOR }}
          PUBLISH_USER: ${{ secrets.PUBLICACAO_UTILIZADOR }}
        run: publish/publish.sh

      - name: Confirmation
        if: steps.secrets.outputs.publish == 'true'
        run: npm run confirm
