# Once a month, one PR for the actions and another for npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # astro check does not support TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Follows the Node major in .nvmrc: raise both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
