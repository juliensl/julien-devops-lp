# The blocking checks, the same in a PR (ci.yml) and before each
# Publishing (publish.yml). Leaves both builds done.
# The quick mode, for PRs into develop, only drops WebKit and the Lighthouse run.
# Runs after checkout and setup-node, which stay in the workflows: Dependabot
# only updates the actions it finds there.
name: Verify
description: Installs, checks types and formatting, makes both builds and runs the Playwright suite and Lighthouse.

inputs:
  performance:
    description: 'Also measures Lighthouse performance, with 3 runs per page (warning only). Publishing turns it off.'
    required: false
    default: 'true'
  quick:
    description: 'Quick checks for PRs into develop: Playwright on Chromium only, no Lighthouse run.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash

    - name: Types and translations
      run: npm run check
      shell: bash

    - name: Formatting
      run: npm run format:check
      shell: bash

    - name: Published build
      run: npm run build
      shell: bash

    - name: Commercial launch build
      run: npm run build:launch
      shell: bash

    - name: Playwright browsers
      env:
        BROWSERS: ${{ inputs.quick == 'true' && 'chromium' || 'chromium webkit' }}
      run: npx playwright install --with-deps $BROWSERS
      shell: bash

    # The quick checks leave out the webkit project; the lighthouse project only tests the checker.
    - name: Playwright suite
      env:
        PROJECTS: ${{ inputs.quick == 'true' && '--project=chromium --project=lighthouse' || '' }}
      run: npm test -- $PROJECTS
      shell: bash

    # SEO, sizes, fonts and requests block. Performance only warns, in the job summary.
    - name: Lighthouse in mobile mode
      if: inputs.quick != 'true'
      env:
        PERFORMANCE: ${{ inputs.performance }}
      run: npm run lighthouse
      shell: bash
