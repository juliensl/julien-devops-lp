# As verificações que bloqueiam, as mesmas num PR (ci.yml) e antes de cada
# Publicação (publish.yml). Deixa os dois builds feitos.
# Corre depois do checkout e do setup-node, que ficam nos workflows: o Dependabot
# só atualiza as actions que encontra lá.
name: Verificar
description: Instala, verifica os tipos e a formatação, faz os dois builds e corre a suite Playwright e o Lighthouse.

inputs:
  desempenho:
    description: 'Mede também o desempenho no Lighthouse, com 3 execuções por página (só avisa). A Publicação desliga-o.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash

    - name: Tipos e traduções
      run: npm run check
      shell: bash

    - name: Formatação
      run: npm run format:check
      shell: bash

    - name: Build publicado
      run: npm run build
      shell: bash

    - name: Build do Lançamento comercial
      run: npm run build:lancamento
      shell: bash

    - name: Navegadores do Playwright
      run: npx playwright install --with-deps chromium webkit
      shell: bash

    - name: Suite Playwright
      run: npm test
      shell: bash

    # O SEO, os pesos, as fontes e os pedidos bloqueiam. O desempenho só avisa, no resumo do job.
    - name: Lighthouse em modo telemóvel
      env:
        DESEMPENHO: ${{ inputs.desempenho }}
      run: npm run lighthouse
      shell: bash
