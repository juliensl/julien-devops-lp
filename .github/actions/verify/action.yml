# The blocking checks, the same in a PR (ci.yml) and before each
# Publishing (publish.yml). Leaves both builds done.
# Each job runs one part of the Playwright suite (`shard`) or the Lighthouse run,
# so the parts run side by side; with neither, it only checks and builds.
# Runs after checkout and setup-node, which stay in the workflows: Dependabot
# only updates the actions it finds there.
name: Verify
description: Installs, checks types and formatting, makes both builds, then runs one part of the Playwright suite or Lighthouse.

inputs:
  shard:
    description: 'The part of the Playwright suite this job runs, as "1/4". Empty: no suite.'
    required: false
    default: ''
  lighthouse:
    description: 'Runs Lighthouse in mobile mode on both builds.'
    required: false
    default: 'false'
  performance:
    description: 'With Lighthouse, also measures performance, with 3 runs per page (warning only). Publishing turns it off.'
    required: false
    default: 'true'
  quick:
    description: 'Quick checks for PRs into develop: the Playwright suite on Chromium only.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash

    - name: Types and translations
      run: npm run check
      shell: bash

    - name: Formatting
      run: npm run format:check
      shell: bash

    - name: Published build
      run: npm run build
      shell: bash

    - name: Commercial launch build
      run: npm run build:launch
      shell: bash

    # Lighthouse and the quick checks only need Chromium.
    - name: Playwright browsers
      if: inputs.shard != '' || inputs.lighthouse == 'true'
      env:
        BROWSERS: ${{ (inputs.shard == '' || inputs.quick == 'true') && 'chromium' || 'chromium webkit' }}
      run: npx playwright install --with-deps $BROWSERS
      shell: bash

    # The quick checks leave out the webkit project; the lighthouse project only tests the checker.
    - name: Playwright suite
      if: inputs.shard != ''
      env:
        SHARD: ${{ inputs.shard }}
        PROJECTS: ${{ inputs.quick == 'true' && '--project=chromium --project=lighthouse' || '' }}
      run: npm test -- --shard=$SHARD $PROJECTS
      shell: bash

    # SEO, sizes, fonts and requests block. Performance only warns, in the job summary.
    - name: Lighthouse in mobile mode
      if: inputs.lighthouse == 'true'
      env:
        PERFORMANCE: ${{ inputs.performance }}
      run: npm run lighthouse
      shell: bash
